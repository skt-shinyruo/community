name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend reactor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run every backend module test
        working-directory: backend
        run: mvn test

  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run unit tests
        working-directory: frontend
        run: npm test
      - name: Build production assets
        working-directory: frontend
        run: npm run build

  node-contracts:
    name: Node contract suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/mock-data-studio/package-lock.json
      - name: Run k6 suite structure contracts
        working-directory: tests/k6
        run: npm test
      - name: Install Mock Data Studio dependencies
        working-directory: tools/mock-data-studio
        run: npm ci
      - name: Audit Mock Data Studio production dependencies
        working-directory: tools/mock-data-studio
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run Mock Data Studio tests
        working-directory: tools/mock-data-studio
        run: npm test

  deploy-contracts:
    name: Deployment contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate schemas, topics, configuration and observability
        run: |
          ./deploy/tests/community_schema_snapshot_contract.sh
          ./deploy/tests/community_forward_migration_contract.sh
          ./deploy/tests/community_forward_migration_mysql.sh
          ./deploy/tests/oss_schema_snapshot_contract.sh
          ./deploy/tests/im_schema_snapshot_contract.sh
          ./deploy/tests/community_backbone_topics_contract.sh
          ./deploy/tests/kafka_topics_contract.sh
          ./deploy/tests/projection_version_baseline_contract.sh
          ./deploy/tests/nacos_config_seed.sh
          ./deploy/tests/observability_contracts.sh
          ./deploy/tests/production_image_contract.sh
          ./deploy/tests/xxl_job_seed_contract.sh
          ./deploy/tests/yierloom_naming_contract.sh
