server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - ${NACOS_CONFIG_IMPORT_SHARED:optional:nacos:community-shared.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_SERVICE:optional:nacos:community-app.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_FEATURE_FLAGS:optional:nacos:community-feature-flags.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_DEGRADATION:optional:nacos:community-degradation.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_CACHE_POLICY:optional:nacos:community-cache-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_KAFKA_POLICY:optional:nacos:community-kafka-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_FRONTEND_RUNTIME:optional:nacos:community-frontend-runtime.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_SEARCH_POLICY:optional:nacos:community-search-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_NOTIFICATION_POLICY:optional:nacos:community-notification-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_UPLOAD_POLICY:optional:nacos:community-upload-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_WORK_PROCESSING:optional:nacos:community-work-processing.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
  application:
    name: community-app
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:${community.upload.max-file-size:10GB}}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:${community.upload.max-request-size:10GB}}
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        metadata:
          version: ${SERVICE_VERSION:@project.version@}
          deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
          zone: ${SERVICE_ZONE:local}
          traffic.group: ${SERVICE_TRAFFIC_GROUP:baseline}
          release.track: ${SERVICE_RELEASE_TRACK:stable}
          weight: ${SERVICE_WEIGHT:100}
          protocol: http
          capabilities: ${SERVICE_CAPABILITIES:}
          management.port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT}}
          draining: ${SERVICE_DRAINING:false}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:COMMUNITY}
        file-extension: yaml
  datasource:
    # Local HA keeps MySQL single-primary for writes; switch DB_PRIMARY_HOST after manual promotion.
    url: ${DB_URL:jdbc:mysql://${DB_PRIMARY_HOST:127.0.0.1}:3306/community?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${MYSQL_USER:community}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:communitypass}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SPRING_MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${growth.task.kafka.consumer.group-id:growth-task-progress}
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.nowcoder.community.*"
        spring.json.use.type.headers: true
    listener:
      ack-mode: record
    producer:
      acks: ${community.kafka-policy.producer.acks:all}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        enable.idempotence: ${community.kafka-policy.producer.enable-idempotence:true}
        max.in.flight.requests.per.connection: ${community.kafka-policy.producer.max-in-flight-requests:5}
        metadata.max.age.ms: ${community.kafka-policy.producer.metadata-max-age-ms:1000}
        reconnect.backoff.ms: ${community.kafka-policy.producer.reconnect-backoff-ms:100}
        reconnect.backoff.max.ms: ${community.kafka-policy.producer.reconnect-backoff-max-ms:1000}
        request.timeout.ms: ${community.kafka-policy.producer.request-timeout-ms:3000}
        delivery.timeout.ms: ${community.kafka-policy.producer.delivery-timeout-ms:5000}
        max.block.ms: ${community.kafka-policy.producer.max-block-ms:5000}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  elasticsearch:
    # Comma-separated node list, for example http://elasticsearch-1:9200,http://elasticsearch-2:9200
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-handlers-package: com.nowcoder.community.infra.persistence.mybatis
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    elasticsearch:
      enabled: true

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        "[service.name]": ${spring.application.name}
        "[service.version]": ${SERVICE_VERSION:@project.version@}
        "[service.namespace]": community
        "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}

community:
  web:
    trusted-proxy:
      enabled: ${COMMUNITY_APP_TRUSTED_PROXY_ENABLED:false}
      cidrs: ${COMMUNITY_APP_TRUSTED_PROXY_CIDRS:}
      source: application-default
  metrics:
    basic-auth:
      username: ${METRICS_BASIC_AUTH_USERNAME:prometheus}
      password: ${METRICS_BASIC_AUTH_PASSWORD:}

security:
  jwt:
    # Base64-encoded X.509 public key for access-token verification.
    access-public-key: ${JWT_ACCESS_PUBLIC_KEY:}
    # Base64-encoded PKCS#8 private key; only community-app may receive it.
    access-private-key: ${JWT_ACCESS_PRIVATE_KEY:}
    # Independent HS256 key for authenticated service-to-service calls.
    service-hmac-secret: ${JWT_SERVICE_HMAC_SECRET:}
    issuer: ${JWT_ISSUER:community-auth}
    access-token-audience: ${JWT_ACCESS_TOKEN_AUDIENCE:community-api}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    refresh-reuse-grace-seconds: 10
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth
    refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}

drive:
  share:
    ticket-secret: ${DRIVE_SHARE_TICKET_SECRET:}

gateway:
  origin-guard:
    enabled: true
    allowed-origins: ${AUTH_ORIGIN_GUARD_ALLOWED_ORIGINS:}
    # 生产建议 fail-closed：allowlist 漏配时拒绝认证相关敏感写入口（/api/auth/**）。
    fail-open-when-allowlist-empty: false

auth:
  refresh:
    cleanup:
      enabled: ${AUTH_REFRESH_CLEANUP_ENABLED:true}
      interval-ms: ${AUTH_REFRESH_CLEANUP_INTERVAL_MS:3600000}
  captcha:
    store: redis
    ttl-seconds: ${AUTH_CAPTCHA_TTL_SECONDS:60}
    max-failures: ${AUTH_CAPTCHA_MAX_FAILURES:3}
    max-issue-requests-per-ip: ${AUTH_CAPTCHA_MAX_ISSUE_REQUESTS_PER_IP:10}
  registration:
    request-limit:
      window-seconds: ${AUTH_REGISTRATION_REQUEST_WINDOW_SECONDS:3600}
      max-requests-per-username: ${AUTH_REGISTRATION_MAX_REQUESTS_PER_USERNAME:3}
      max-requests-per-email: ${AUTH_REGISTRATION_MAX_REQUESTS_PER_EMAIL:3}
      max-requests-per-ip: ${AUTH_REGISTRATION_MAX_REQUESTS_PER_IP:10}
    resend-limit:
      window-seconds: ${AUTH_REGISTRATION_RESEND_WINDOW_SECONDS:3600}
      max-requests-per-registration: ${AUTH_REGISTRATION_RESEND_MAX_REQUESTS_PER_REGISTRATION:5}
      max-requests-per-email: ${AUTH_REGISTRATION_RESEND_MAX_REQUESTS_PER_EMAIL:5}
      max-requests-per-ip: ${AUTH_REGISTRATION_RESEND_MAX_REQUESTS_PER_IP:20}
    code:
      store: redis
      ttl-seconds: ${AUTH_REGISTRATION_CODE_TTL_SECONDS:600}
      max-failures: ${AUTH_REGISTRATION_CODE_MAX_FAILURES:3}
      resend-cooldown-seconds: ${AUTH_REGISTRATION_CODE_RESEND_COOLDOWN_SECONDS:60}
      operation-lease-seconds: ${AUTH_REGISTRATION_CODE_OPERATION_LEASE_SECONDS:120}
      expose-code: ${AUTH_REGISTRATION_EXPOSE_CODE:false}
    draft:
      store: ${AUTH_REGISTRATION_DRAFT_STORE:redis}
      ttl-seconds: ${AUTH_REGISTRATION_DRAFT_TTL_SECONDS:1800}
    mail:
      enabled: ${AUTH_MAIL_ENABLED:false}
      from: ${AUTH_MAIL_FROM:no-reply@community.local}
      subject: 注册验证码
  password-reset:
    reset-base-url: ${AUTH_PASSWORD_RESET_BASE_URL:}
    identifier-hmac-secret: ${AUTH_PASSWORD_RESET_IDENTIFIER_HMAC_SECRET}
    quota-hmac-secret: ${AUTH_PASSWORD_RESET_QUOTA_HMAC_SECRET:}
    previous-identifier-hmac-secrets: ${AUTH_PASSWORD_RESET_PREVIOUS_IDENTIFIER_HMAC_SECRETS:}
    store: redis
    ttl-seconds: ${AUTH_PASSWORD_RESET_TTL_SECONDS:600}
    request-window-seconds: ${AUTH_PASSWORD_RESET_REQUEST_WINDOW_SECONDS:3600}
    max-requests-per-email: ${AUTH_PASSWORD_RESET_MAX_REQUESTS_PER_EMAIL:3}
    max-requests-per-ip: ${AUTH_PASSWORD_RESET_MAX_REQUESTS_PER_IP:20}
  login-rate-limit:
    enabled: true
    window-seconds: 60
    max-failures-per-ip: 20
    max-failures-per-user: 5
    password-check-lease-seconds: 120
    captcha-required-failures-per-ip: 5
    captcha-required-failures-per-user: 2

http:
  idempotency:
    enabled: true
    store: DB

market:
  order:
    auto-confirm-batch-size: ${MARKET_ORDER_AUTO_CONFIRM_BATCH_SIZE:100}

wallet:
  deadlock-retry:
    max-attempts: ${WALLET_DEADLOCK_RETRY_MAX_ATTEMPTS:3}
    backoff: ${WALLET_DEADLOCK_RETRY_BACKOFF:10ms}
  test-credits:
    enabled: ${WALLET_TEST_CREDITS_ENABLED:false}
    grant-enabled: ${WALLET_TEST_CREDIT_GRANT_ENABLED:false}
    discard-enabled: ${WALLET_TEST_CREDIT_DISCARD_ENABLED:false}
    max-grant-per-request: ${WALLET_TEST_CREDIT_MAX_GRANT_PER_REQUEST:1000}
    max-discard-per-request: ${WALLET_TEST_CREDIT_MAX_DISCARD_PER_REQUEST:1000}
    grant-quota-per-user: ${WALLET_TEST_CREDIT_GRANT_QUOTA_PER_USER:5000}
    discard-quota-per-user: ${WALLET_TEST_CREDIT_DISCARD_QUOTA_PER_USER:5000}

content:
  comments:
    first-page-cache-ttl-seconds: ${CONTENT_COMMENT_FIRST_PAGE_CACHE_TTL_SECONDS:15}
  comment-thread-cleanup:
    enabled: ${CONTENT_COMMENT_THREAD_CLEANUP_ENABLED:true}
    batch-size: ${CONTENT_COMMENT_THREAD_CLEANUP_BATCH_SIZE:100}
    max-batches-per-root: ${CONTENT_COMMENT_THREAD_CLEANUP_MAX_BATCHES_PER_ROOT:10}
    delay-ms: ${CONTENT_COMMENT_THREAD_CLEANUP_DELAY_MS:60000}
  counters:
    flush-batch-size: ${CONTENT_COUNTER_FLUSH_BATCH_SIZE:200}
  feed:
    hot-rank-version: ${CONTENT_FEED_HOT_RANK_VERSION:hot-v2}
    latest-fallback-enabled: ${CONTENT_FEED_LATEST_FALLBACK_ENABLED:true}
  events:
    outbox-topic: ${CONTENT_EVENTS_OUTBOX_TOPIC:eventbus.content}
    kafka-topic: ${CONTENT_EVENTS_KAFKA_TOPIC:content.events}
  score:
    refresh:
      enabled: true
      batch-size: 200

events:
  outbox:
    enabled: true
    batch-size: 50
    processing-lease: 30s
    max-retries: 50
    base-backoff: 5s
    max-backoff: 10m
    worker-fixed-delay-ms: 1000

social:
  events:
    outbox-topic: ${SOCIAL_EVENTS_OUTBOX_TOPIC:eventbus.social}
    kafka-topic: ${SOCIAL_EVENTS_KAFKA_TOPIC:social.events}

notice:
  projection-enabled: ${NOTICE_PROJECTION_ENABLED:true}
  kafka:
    consumer:
      group-id: ${NOTICE_KAFKA_CONSUMER_GROUP_ID:notice-projection}
      concurrency: ${NOTICE_KAFKA_CONSUMER_CONCURRENCY:3}

growth:
  task:
    kafka:
      consumer:
        group-id: ${GROWTH_TASK_KAFKA_CONSUMER_GROUP_ID:growth-task-progress}
        concurrency: ${GROWTH_TASK_KAFKA_CONSUMER_CONCURRENCY:3}

oss:
  client:
    base-url: ${OSS_CLIENT_BASE_URL:http://community-oss:18090}
    service-subject: ${OSS_CLIENT_SERVICE_SUBJECT:community-app}
    audience: ${OSS_CLIENT_AUDIENCE:community-oss}
    scope: ${OSS_CLIENT_SCOPE:oss.internal}
    token-ttl: ${OSS_CLIENT_TOKEN_TTL:PT5M}

search:
  projection-enabled: ${SEARCH_PROJECTION_ENABLED:true}
  reindex:
    page-size: ${SEARCH_REINDEX_PAGE_SIZE:500}
    lock-ttl: ${SEARCH_REINDEX_LOCK_TTL:PT30M}
  kafka:
    consumer:
      group-id: ${SEARCH_KAFKA_CONSUMER_GROUP_ID:search-post-projection}
      concurrency: ${SEARCH_KAFKA_CONSUMER_CONCURRENCY:3}
  idempotency:
    cleanup-enabled: true
    retention-days: 7
    cleanup-interval-ms: 21600000
  index:
    prefix: community_posts_v
    keep-history: ${SEARCH_INDEX_KEEP_HISTORY:2}

analytics:
  max-days-range: 31
  ingest:
    enabled: false
    kafka-topic: ${ANALYTICS_INGEST_KAFKA_TOPIC:analytics.request}
    kafka-group-id: ${ANALYTICS_INGEST_KAFKA_GROUP_ID:analytics-request}
    kafka-concurrency: ${ANALYTICS_INGEST_KAFKA_CONCURRENCY:2}
    record-uv: true
    record-dau: true
    include-paths:
      - /api/posts/**
      - /api/search/**
      - /api/notices/**
    exclude-paths:
      - /api/analytics/**
      - /api/auth/**
      - /actuator/**
      - /internal/**
      - /files/**

user:
  events:
    outbox-topic: ${USER_EVENTS_OUTBOX_TOPIC:eventbus.user}
    kafka-topic: ${USER_EVENTS_KAFKA_TOPIC:user.events}
  reward:
    kafka:
      consumer:
        group-id: ${USER_REWARD_KAFKA_CONSUMER_GROUP_ID:user-reward-projection}
        concurrency: ${USER_REWARD_KAFKA_CONSUMER_CONCURRENCY:3}
