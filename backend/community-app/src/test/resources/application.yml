spring:
  application:
    name: community-app-test
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:community-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    listener:
      auto-startup: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.nowcoder.community.infra.persistence.mybatis
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    access-public-key: 
    access-private-key: 
    service-hmac-secret: test-service-jwt-secret-at-least-32-bytes
    issuer: community-auth
    access-token-audience: community-api

oss:
  client:
    base-url: http://community-oss:18090
    service-subject: community-app
    audience: community-oss
    scope: oss.internal
    token-ttl: PT5M

community:
  metrics:
    basic-auth:
      username: prometheus
      password: test-prometheus-pass-please-change

auth:
  refresh:
    store: db
    cleanup:
      enabled: false
  captcha:
    store: redis
    ttl-seconds: 60
    max-failures: 3
  password-reset:
    reset-base-url: http://localhost:8080
    identifier-hmac-secret: test-password-reset-identifier-hmac-secret-20260804
    quota-hmac-secret: test-password-reset-stable-quota-hmac-secret-20260805
    store: redis
    ttl-seconds: 600
  registration:
    request-limit:
      window-seconds: 3600
      max-requests-per-username: 3
      max-requests-per-email: 3
      max-requests-per-ip: 10
    resend-limit:
      window-seconds: 3600
      max-requests-per-registration: 5
      max-requests-per-email: 5
      max-requests-per-ip: 20
    code:
      store: redis
      ttl-seconds: 600
      max-failures: 3
      resend-cooldown-seconds: 60
      operation-lease-seconds: 120
      expose-code: true
    draft:
      store: redis
      ttl-seconds: 1800
    mail:
      enabled: false
  login-rate-limit:
    captcha-required-failures-per-ip: 5
    captcha-required-failures-per-user: 2

content:
  storage: redis
  comment-thread-cleanup:
    enabled: false
  hot-path:
    prewarm:
      enabled: false
  counter:
    flush:
      enabled: false
  events:
    outbox-topic: ${CONTENT_EVENTS_OUTBOX_TOPIC:eventbus.content}
    kafka-topic: ${CONTENT_EVENTS_KAFKA_TOPIC:content.events}
  score:
    refresh:
      enabled: false

events:
  outbox:
    enabled: true
    worker-enabled: false

social:
  storage: db
  events:
    outbox-topic: ${SOCIAL_EVENTS_OUTBOX_TOPIC:eventbus.social}
    kafka-topic: ${SOCIAL_EVENTS_KAFKA_TOPIC:social.events}

notice:
  kafka:
    consumer:
      group-id: ${NOTICE_KAFKA_CONSUMER_GROUP_ID:notice-projection}
      concurrency: ${NOTICE_KAFKA_CONSUMER_CONCURRENCY:3}

user:
  events:
    outbox-topic: ${USER_EVENTS_OUTBOX_TOPIC:eventbus.user}
    kafka-topic: ${USER_EVENTS_KAFKA_TOPIC:user.events}
  reward:
    kafka:
      consumer:
        group-id: ${USER_REWARD_KAFKA_CONSUMER_GROUP_ID:user-reward-projection}
        concurrency: ${USER_REWARD_KAFKA_CONSUMER_CONCURRENCY:3}

search:
  storage: es
  reindex:
    page-size: 50
    lock-ttl: PT5M
  index:
    initialize: false
    keep-history: 2
  kafka:
    consumer:
      group-id: ${SEARCH_KAFKA_CONSUMER_GROUP_ID:search-post-projection}
      concurrency: ${SEARCH_KAFKA_CONSUMER_CONCURRENCY:3}
  idempotency:
    cleanup-enabled: false
    retention-days: 1

analytics:
  max-days-range: 31
  ingest:
    enabled: false
    record-uv: true
    record-dau: true
    include-paths:
      - /api/posts/**
      - /api/search/**
      - /api/notices/**
    exclude-paths:
      - /api/analytics/**
      - /api/auth/**
      - /actuator/**
      - /internal/**
      - /files/**

clients:
  user:
    fail-open: true
  social:
    fail-open: true

http:
  idempotency:
    enabled: true
    store: DB

xxl:
  job:
    enabled: false

wallet:
  test-credits:
    enabled: true
    grant-enabled: true
    discard-enabled: true
    max-grant-per-request: 5000
    max-discard-per-request: 5000
    grant-quota-per-user: 10000
    discard-quota-per-user: 10000

drive:
  share:
    ticket-secret: test-drive-share-ticket-secret
  upload:
    recovery:
      enabled: false
