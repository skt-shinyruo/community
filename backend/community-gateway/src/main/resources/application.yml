server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - ${NACOS_CONFIG_IMPORT_SHARED:optional:nacos:community-shared.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_SERVICE:optional:nacos:community-gateway.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_FEATURE_FLAGS:optional:nacos:community-feature-flags.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_DEGRADATION:optional:nacos:community-degradation.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_CACHE_POLICY:optional:nacos:community-cache-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_KAFKA_POLICY:optional:nacos:community-kafka-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_CANARY_ROUTING:optional:nacos:community-canary-routing.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
  application:
    name: community-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          forwarded:
            enabled: false
          x-forwarded:
            enabled: false
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        metadata:
          version: ${SERVICE_VERSION:@project.version@}
          deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
          zone: ${SERVICE_ZONE:local}
          traffic.group: ${SERVICE_TRAFFIC_GROUP:baseline}
          release.track: ${SERVICE_RELEASE_TRACK:stable}
          weight: ${SERVICE_WEIGHT:100}
          protocol: http
          capabilities: ${SERVICE_CAPABILITIES:}
          management.port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT}}
          draining: ${SERVICE_DRAINING:false}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:COMMUNITY}
        file-extension: yaml

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        "[service.name]": ${spring.application.name}
        "[service.version]": ${SERVICE_VERSION:@project.version@}
        "[service.namespace]": community
        "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}

security:
  jwt:
    # Gateway verifies access tokens and never receives signing material.
    access-public-key: ${JWT_ACCESS_PUBLIC_KEY:}
    issuer: ${JWT_ISSUER:community-auth}
    access-token-audience: ${JWT_ACCESS_TOKEN_AUDIENCE:community-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

gateway:
  trusted-proxy:
    enabled: ${GATEWAY_TRUSTED_PROXY_ENABLED:false}
    cidrs: ${GATEWAY_TRUSTED_PROXY_CIDRS:}
    source: application-default
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
  im-edge:
    service-id: ${GATEWAY_IM_EDGE_SERVICE_ID:community-im-gateway}
    session-path: /api/im/sessions
    ws-path: /ws/im
  http:
    routes:
      - id: oss-api
        path-prefix: /api/oss
        service-id: community-oss
      - id: im-core
        path-prefix: /api/im
        service-id: im-core
      - id: bootstrap-api
        path-prefix: /api
        service-id: community-app
      - id: oss-files
        path-prefix: /files
        service-id: community-oss
    rate-limit:
      enabled: true
      fail-open-on-error: false
      policies:
        "[/api/drive/shares/{shareToken}/verify]":
          enabled: true
          limit: 10
          window: 1m
    traffic-policy:
      default-policy-id: baseline
      default-tags:
        plane: http
      rules: []
