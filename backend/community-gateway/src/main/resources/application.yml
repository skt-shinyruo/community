server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - ${NACOS_CONFIG_IMPORT_SHARED:optional:nacos:community-shared.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_SERVICE:optional:nacos:community-gateway.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_FEATURE_FLAGS:optional:nacos:community-feature-flags.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_KAFKA_POLICY:optional:nacos:community-kafka-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
  application:
    name: community-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Regex matching the proxy peers (NGINX) allowed to assert Forwarded/X-Forwarded-*
          # identity headers. Unset/empty = strip inbound forwarding headers (safe default).
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
          # Lets the Netty server resolve the inbound remote address from X-Forwarded-For
          # when the direct peer matches trusted-proxies (inert when trusted-proxies is empty).
          httpserver:
            customizer-enabled: true
          # CORS is only attached to the browser-facing API/file paths; the websocket
          # route (/ws/im) is intentionally not registered and stays without CORS headers.
          globalcors:
            cors-configurations:
              "[/api/**]":
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
                allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                allowed-headers: "*"
                exposed-headers: "traceparent"
                allow-credentials: true
                max-age: 3600
              "[/files/**]":
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
                allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                allowed-headers: "*"
                exposed-headers: "traceparent"
                allow-credentials: true
                max-age: 3600
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods Access-Control-Expose-Headers Access-Control-Max-Age, RETAIN_FIRST
          routes:
            - id: drive-share-verify-rate-limit
              order: -30
              uri: lb://community-app
              predicates:
                - Path=/api/drive/shares/*/verify
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@gatewayRateLimitKeyResolver}"
            - id: im-session-edge
              order: -100
              uri: lb://${GATEWAY_IM_EDGE_SERVICE_ID:community-im-gateway}
              predicates:
                - Method=POST
                - Path=/api/im/sessions
            - id: im-ws-edge
              order: -100
              uri: lb:ws://${GATEWAY_IM_EDGE_SERVICE_ID:community-im-gateway}
              predicates:
                - Path=/ws/im
                - Header=Upgrade, (?i)websocket
            - id: oss-api
              order: -20
              uri: lb://community-oss
              predicates:
                - Path=/api/oss,/api/oss/**
            - id: im-core
              order: -10
              uri: lb://im-core
              predicates:
                - Path=/api/im,/api/im/**
            - id: bootstrap-api
              uri: lb://community-app
              predicates:
                - Path=/api,/api/**
            - id: oss-files
              uri: lb://community-oss
              predicates:
                - Path=/files,/files/**
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        metadata:
          version: ${SERVICE_VERSION:@project.version@}
          deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
          zone: ${SERVICE_ZONE:local}
          traffic.group: ${SERVICE_TRAFFIC_GROUP:baseline}
          release.track: ${SERVICE_RELEASE_TRACK:stable}
          weight: ${SERVICE_WEIGHT:100}
          protocol: http
          capabilities: ${SERVICE_CAPABILITIES:}
          management.port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT}}
          draining: ${SERVICE_DRAINING:false}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:COMMUNITY}
        file-extension: yaml

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        "[service.name]": ${spring.application.name}
        "[service.version]": ${SERVICE_VERSION:@project.version@}
        "[service.namespace]": community
        "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}

security:
  jwt:
    # Gateway verifies access tokens and never receives signing material.
    access-public-key: ${JWT_ACCESS_PUBLIC_KEY:}
    issuer: ${JWT_ISSUER:community-auth}
    access-token-audience: ${JWT_ACCESS_TOKEN_AUDIENCE:community-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
