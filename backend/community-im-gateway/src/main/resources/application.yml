server:
  port: ${SERVER_PORT:18083}

spring:
  config:
    import:
      - ${NACOS_CONFIG_IMPORT_SHARED:optional:nacos:community-shared.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_SERVICE:optional:nacos:community-im-gateway.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_FEATURE_FLAGS:optional:nacos:community-feature-flags.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_KAFKA_POLICY:optional:nacos:community-kafka-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
  application:
    name: community-im-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        metadata:
          version: ${SERVICE_VERSION:@project.version@}
          deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
          zone: ${SERVICE_ZONE:local}
          traffic.group: ${SERVICE_TRAFFIC_GROUP:baseline}
          release.track: ${SERVICE_RELEASE_TRACK:stable}
          weight: ${SERVICE_WEIGHT:100}
          protocol: http
          capabilities: ${SERVICE_CAPABILITIES:}
          management.port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT}}
          draining: ${SERVICE_DRAINING:false}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:COMMUNITY}
        file-extension: yaml

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        "[service.name]": ${spring.application.name}
        "[service.version]": ${SERVICE_VERSION:@project.version@}
        "[service.namespace]": community
        "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}

security:
  jwt:
    access-public-key: ${JWT_ACCESS_PUBLIC_KEY:}
    issuer: ${JWT_ISSUER:community-auth}
    access-token-audience: ${JWT_ACCESS_TOKEN_AUDIENCE:community-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

im:
  access-token-freshness:
    community-service-id: ${IM_ACCESS_TOKEN_FRESHNESS_COMMUNITY_SERVICE_ID:community-app}
    request-timeout: ${IM_ACCESS_TOKEN_FRESHNESS_REQUEST_TIMEOUT:500ms}
  session-ticket:
    hmac-secret: ${IM_SESSION_TICKET_HMAC_SECRET:}
    issuer: ${IM_SESSION_TICKET_ISSUER:community-im-gateway}
    audience: ${IM_SESSION_TICKET_AUDIENCE:im-realtime}
  gateway:
    cors:
      allowed-origins: ${IM_GATEWAY_CORS_ALLOWED_ORIGINS:}
    public-ws-url: ${IM_GATEWAY_PUBLIC_WS_URL:}
    session:
      ticket-ttl: ${IM_SESSION_TICKET_TTL:PT2M}
    worker:
      service-id: ${IM_REALTIME_WORKER_SERVICE_ID:im-realtime-worker}
      worker-id-metadata-key: ${IM_SESSION_WORKER_ID_METADATA_KEY:workerId}
    ws:
      path: ${IM_GATEWAY_WS_PATH:/ws/im}
      first-frame-timeout-ms: ${IM_GATEWAY_FIRST_FRAME_TIMEOUT_MS:5000}
      max-inbound-chars: ${IM_GATEWAY_WS_MAX_INBOUND_CHARS:10000}
      max-inbound-buffer-frames: ${IM_GATEWAY_WS_MAX_INBOUND_BUFFER_FRAMES:64}
