spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:im_core_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:0
    listener:
      auto-startup: false

security:
  jwt:
    access-public-key: 
    service-hmac-secret: test-service-jwt-secret-at-least-32-bytes
    issuer: community-auth
    access-token-audience: community-api

events:
  outbox:
    enabled: false

im:
  access-token-freshness:
    community-service-id: community-app
    request-timeout: 500ms
  policy:
    rejection-cache-ttl: 0ms
  room:
    max-members: 3
  room-member-change:
    publisher: noop
