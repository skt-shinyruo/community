server:
  port: ${SERVER_PORT:18090}

spring:
  config:
    import:
      - ${NACOS_CONFIG_IMPORT_SHARED:optional:nacos:community-shared.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_SERVICE:optional:nacos:community-oss.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_FEATURE_FLAGS:optional:nacos:community-feature-flags.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_DEGRADATION:optional:nacos:community-degradation.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_CACHE_POLICY:optional:nacos:community-cache-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_KAFKA_POLICY:optional:nacos:community-kafka-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
      - ${NACOS_CONFIG_IMPORT_UPLOAD_POLICY:optional:nacos:community-upload-policy.yaml?group=${NACOS_CONFIG_GROUP:COMMUNITY}}
  application:
    name: community-oss
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:${community.upload.max-file-size:10GB}}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:${community.upload.max-request-size:10GB}}
  datasource:
    url: ${OSS_DB_URL:jdbc:mysql://mysql:3306/community_oss?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${OSS_DB_USERNAME:community_oss}
    password: ${OSS_DB_PASSWORD:communityosspass}
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        metadata:
          version: ${SERVICE_VERSION:@project.version@}
          deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
          zone: ${SERVICE_ZONE:local}
          traffic.group: ${SERVICE_TRAFFIC_GROUP:baseline}
          release.track: ${SERVICE_RELEASE_TRACK:stable}
          weight: ${SERVICE_WEIGHT:100}
          protocol: http
          capabilities: ${SERVICE_CAPABILITIES:}
          management.port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT}}
          draining: ${SERVICE_DRAINING:false}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:COMMUNITY}
        file-extension: yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-handlers-package: com.nowcoder.community.oss.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true

community:
  oss:
    upload-recovery:
      enabled: ${OSS_UPLOAD_RECOVERY_ENABLED:true}
      batch-size: ${OSS_UPLOAD_RECOVERY_BATCH_SIZE:100}
      stale-seconds: ${OSS_UPLOAD_RECOVERY_STALE_SECONDS:2100}
      cancellation-stale-seconds: ${OSS_UPLOAD_RECOVERY_CANCELLATION_STALE_SECONDS:300}
      delay-ms: ${OSS_UPLOAD_RECOVERY_DELAY_MS:60000}
  metrics:
    basic-auth:
      username: ${METRICS_BASIC_AUTH_USERNAME:prometheus}
      password: ${METRICS_BASIC_AUTH_PASSWORD:}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        "[service.name]": ${spring.application.name}
        "[service.version]": ${SERVICE_VERSION:@project.version@}
        "[service.namespace]": community
        "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}

security:
  jwt:
    access-public-key: ${JWT_ACCESS_PUBLIC_KEY:}
    service-hmac-secret: ${JWT_SERVICE_HMAC_SECRET:}
    issuer: ${JWT_ISSUER:community-auth}
    access-token-audience: ${JWT_ACCESS_TOKEN_AUDIENCE:community-api}

oss:
  security:
    service-jwt:
      issuer: ${OSS_SERVICE_JWT_ISSUER:community-auth}
      audience: ${OSS_SERVICE_JWT_AUDIENCE:community-oss}
      scope: ${OSS_SERVICE_JWT_SCOPE:oss.internal}
  object-store:
    mode: ${OSS_OBJECT_STORE_MODE:garage}
    endpoint: ${OSS_OBJECT_STORE_ENDPOINT:http://garage:3900}
    access-key: ${OSS_OBJECT_STORE_ACCESS_KEY:}
    secret-key: ${OSS_OBJECT_STORE_SECRET_KEY:}
    bucket: ${OSS_OBJECT_STORE_BUCKET:community-oss}
    region: ${OSS_OBJECT_STORE_REGION:garage}
    path-style: ${OSS_OBJECT_STORE_PATH_STYLE:true}
    local-root: ${OSS_OBJECT_STORE_LOCAL_ROOT:/tmp/community-oss}
    api-call-timeout: ${OSS_OBJECT_STORE_API_CALL_TIMEOUT:30m}
  public-base-url: ${OSS_PUBLIC_BASE_URL:http://localhost:12880}
