services:
  mysql:
    image: mysql:8.0
    mem_limit: ${MYSQL_MEM_LIMIT:-512m}
    environment:
    - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    - MYSQL_ROOT_HOST=%
    - COMMUNITY_MYSQL_USER=${MYSQL_USER:-community}
    - COMMUNITY_MYSQL_PASSWORD=${MYSQL_PASSWORD:-communitypass}
    - COMMUNITY_MIGRATION_USERNAME=${COMMUNITY_MIGRATION_USERNAME:-community_migrator}
    - COMMUNITY_MIGRATION_PASSWORD=${COMMUNITY_MIGRATION_PASSWORD:?COMMUNITY_MIGRATION_PASSWORD is required}
    - IM_MYSQL_USER=${IM_MYSQL_USER:-im_core}
    - IM_MYSQL_PASSWORD=${IM_MYSQL_PASSWORD:-imcorepass}
    - OSS_MYSQL_USER=${OSS_MYSQL_USER:-community_oss}
    - OSS_MYSQL_PASSWORD=${OSS_MYSQL_PASSWORD:-communityosspass}
    - MOCK_DATA_STUDIO_DB_USER=${MOCK_DATA_STUDIO_DB_USER:-mock_data_studio}
    - MOCK_DATA_STUDIO_DB_PASSWORD=${MOCK_DATA_STUDIO_DB_PASSWORD:-mockdatastudiopass}
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --default-time-zone=+00:00
    volumes:
    - mysql_primary_data:/var/lib/mysql
    - ./mysql/conf/mysql-client.cnf:/etc/mysql/conf.d/mysql-client.cnf:ro
    - ./mysql/primary-init/001_create_databases.sh:/docker-entrypoint-initdb.d/001_create_databases.sh:ro
    - ./mysql/primary-init/010_current_schema.sql:/docker-entrypoint-initdb.d/010_current_schema.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      default:
        aliases:
        - mysql
        - mysql-primary
  community-db-user-bootstrap:
    image: mysql:8.0
    mem_limit: ${MYSQL_BOOTSTRAP_MEM_LIMIT:-256m}
    entrypoint:
    - /bin/bash
    - /bootstrap/001_create_databases.sh
    environment:
    - MYSQL_HOST=${DB_PRIMARY_HOST:-mysql}
    - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    - COMMUNITY_MYSQL_USER=${MYSQL_USER:-community}
    - COMMUNITY_MYSQL_PASSWORD=${MYSQL_PASSWORD:-communitypass}
    - COMMUNITY_MIGRATION_USERNAME=${COMMUNITY_MIGRATION_USERNAME:-community_migrator}
    - COMMUNITY_MIGRATION_PASSWORD=${COMMUNITY_MIGRATION_PASSWORD:?COMMUNITY_MIGRATION_PASSWORD is required}
    - IM_MYSQL_USER=${IM_MYSQL_USER:-im_core}
    - IM_MYSQL_PASSWORD=${IM_MYSQL_PASSWORD:-imcorepass}
    - OSS_MYSQL_USER=${OSS_MYSQL_USER:-community_oss}
    - OSS_MYSQL_PASSWORD=${OSS_MYSQL_PASSWORD:-communityosspass}
    - MOCK_DATA_STUDIO_DB_USER=${MOCK_DATA_STUDIO_DB_USER:-mock_data_studio}
    - MOCK_DATA_STUDIO_DB_PASSWORD=${MOCK_DATA_STUDIO_DB_PASSWORD:-mockdatastudiopass}
    volumes:
    - ./mysql/primary-init/001_create_databases.sh:/bootstrap/001_create_databases.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'
  community-db-migrations:
    image: mysql:8.0
    mem_limit: ${MYSQL_BOOTSTRAP_MEM_LIMIT:-256m}
    user: "1000:1000"
    entrypoint:
    - /bin/bash
    - /migration/run-community-migrations.sh
    environment:
    - DB_PRIMARY_HOST=${DB_PRIMARY_HOST:-mysql}
    - DB_PRIMARY_PORT=3306
    - COMMUNITY_MYSQL_DATABASE=community
    - COMMUNITY_MIGRATION_USERNAME=${COMMUNITY_MIGRATION_USERNAME:-community_migrator}
    - COMMUNITY_MIGRATION_PASSWORD=${COMMUNITY_MIGRATION_PASSWORD:?COMMUNITY_MIGRATION_PASSWORD is required}
    volumes:
    - ./scripts/run-community-migrations.sh:/migration/run-community-migrations.sh:ro
    - ./mysql/community-migrations:/migrations:ro
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    depends_on:
      community-db-user-bootstrap:
        condition: service_completed_successfully
    restart: 'no'
  community-dev-seed:
    image: mysql:8.0
    mem_limit: ${MYSQL_BOOTSTRAP_MEM_LIMIT:-256m}
    entrypoint:
    - /bin/bash
    - -euc
    command:
    - |
      if [ "$${COMMUNITY_DEV_SEED_ENABLED}" != "true" ]; then
        echo '[community-dev-seed] disabled';
        exit 0;
      fi
      if [ "$${DEPLOYMENT_ENVIRONMENT}" != "development" ]; then
        echo '[community-dev-seed] DEPLOYMENT_ENVIRONMENT must equal development' >&2;
        exit 1;
      fi
      exec mysql --default-character-set=utf8mb4 -h"$${DB_PRIMARY_HOST}" -u"$${MYSQL_USER}" community < /seed/090_seed_identity.sql
    environment:
    - COMMUNITY_DEV_SEED_ENABLED=${COMMUNITY_DEV_SEED_ENABLED:-false}
    - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:?DEPLOYMENT_ENVIRONMENT is required}
    - DB_PRIMARY_HOST=${DB_PRIMARY_HOST:-mysql}
    - MYSQL_USER=${MYSQL_USER:-community}
    - MYSQL_PWD=${MYSQL_PASSWORD:-communitypass}
    volumes:
    - ./mysql/community/090_seed_identity.sql:/seed/090_seed_identity.sql:ro
    depends_on:
      community-db-migrations:
        condition: service_completed_successfully
    restart: 'no'
