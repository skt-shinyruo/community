services:
  community-app-1:
    <<: *community-app-base
    environment:
      <<: *community-app-environment
      XXL_JOB_EXECUTOR_ADDRESS: "${XXL_JOB_EXECUTOR_ADDRESS:-http://community-app-1:9999/}"
    networks:
      default:
        aliases:
        - community-app

  community-app-2:
    <<: *community-app-base
    environment:
      <<: *community-app-environment
      XXL_JOB_EXECUTOR_ADDRESS: "${XXL_JOB_EXECUTOR_ADDRESS:-http://community-app-2:9999/}"

  community-app-3:
    <<: *community-app-base
    environment:
      <<: *community-app-environment
      XXL_JOB_EXECUTOR_ADDRESS: "${XXL_JOB_EXECUTOR_ADDRESS:-http://community-app-3:9999/}"

  community-oss-1:
    <<: *community-oss-base
    depends_on:
      community-db-user-bootstrap:
        condition: service_completed_successfully
      mysql-replication-bootstrap:
        condition: service_completed_successfully
      nacos-db-bootstrap:
        condition: service_completed_successfully
      nacos-config-bootstrap:
        condition: service_completed_successfully
      nacos-1:
        condition: service_healthy
      mysql-primary:
        condition: service_healthy
      garage-1:
        condition: service_started
      garage-2:
        condition: service_started
      garage-3:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
        - community-oss

  community-oss-2:
    <<: *community-oss-base
    depends_on:
      community-oss-1:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully

  community-oss-3:
    <<: *community-oss-base
    depends_on:
      community-oss-1:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully

  community-gateway-1:
    <<: *community-gateway-base
    networks:
      default:
        ipv4_address: ${COMMUNITY_GATEWAY_1_STATIC_IP:?COMMUNITY_GATEWAY_1_STATIC_IP is required}
        aliases:
        - community-gateway

  community-gateway-2:
    <<: *community-gateway-base
    networks:
      default:
        ipv4_address: ${COMMUNITY_GATEWAY_2_STATIC_IP:?COMMUNITY_GATEWAY_2_STATIC_IP is required}

  community-gateway-3:
    <<: *community-gateway-base
    networks:
      default:
        ipv4_address: ${COMMUNITY_GATEWAY_3_STATIC_IP:?COMMUNITY_GATEWAY_3_STATIC_IP is required}

  community-im-gateway-1:
    <<: *community-im-gateway-base
    networks:
      default:
        aliases:
        - community-im-gateway

  community-im-gateway-2:
    <<: *community-im-gateway-base
    networks:
      default:
        aliases:
        - community-im-gateway

  community-im-gateway-3:
    <<: *community-im-gateway-base
    networks:
      default:
        aliases:
        - community-im-gateway

  im-core-1:
    <<: *im-core-base
    networks:
      default:
        aliases:
        - im-core

  im-core-2:
    <<: *im-core-base

  im-core-3:
    <<: *im-core-base

  im-realtime-1:
    <<: *im-realtime-base
    environment:
      <<: *im-realtime-environment
      IM_REALTIME_WORKER_ID: "${IM_REALTIME_WORKER_ID_PREFIX:-im-realtime}-1"
      IM_ROOM_FANOUT_WORKER_INBOX_SLOT: "0"
    networks:
      default:
        aliases:
        - im-realtime

  im-realtime-2:
    <<: *im-realtime-base
    environment:
      <<: *im-realtime-environment
      IM_REALTIME_WORKER_ID: "${IM_REALTIME_WORKER_ID_PREFIX:-im-realtime}-2"
      IM_ROOM_FANOUT_WORKER_INBOX_SLOT: "1"

  im-realtime-3:
    <<: *im-realtime-base
    environment:
      <<: *im-realtime-environment
      IM_REALTIME_WORKER_ID: "${IM_REALTIME_WORKER_ID_PREFIX:-im-realtime}-3"
      IM_ROOM_FANOUT_WORKER_INBOX_SLOT: "2"
