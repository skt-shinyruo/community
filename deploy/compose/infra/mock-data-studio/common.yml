services:
  mock-data-studio-db-bootstrap:
    image: mysql:8.0
    mem_limit: ${MYSQL_BOOTSTRAP_MEM_LIMIT:-256m}
    entrypoint:
    - /bin/bash
    - -lc
    command:
    - |
      set -euo pipefail
      sql_escape() {
        local value="$${1//\\/\\\\}"
        value="$${value//\'/\'\'}"
        printf "%s" "$${value}"
      }

      STUDIO_USER_ESCAPED="$$(sql_escape "$${MOCK_DATA_STUDIO_DB_USER:-mock_data_studio}")"
      STUDIO_PASSWORD_ESCAPED="$$(sql_escape "$${MOCK_DATA_STUDIO_DB_PASSWORD:-mockdatastudiopass}")"

      mysql --default-character-set=utf8mb4 -h"$${DB_PRIMARY_HOST}" -uroot -p"$${MYSQL_ROOT_PASSWORD}" <<SQL
      create user if not exists '$${STUDIO_USER_ESCAPED}'@'%' identified by '$${STUDIO_PASSWORD_ESCAPED}';
      grant select, insert, update, delete on \`community\`.* to '$${STUDIO_USER_ESCAPED}'@'%';
      grant select, insert, update, delete on \`im_core\`.* to '$${STUDIO_USER_ESCAPED}'@'%';
      flush privileges;
      SQL
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MOCK_DATA_STUDIO_DB_USER: ${MOCK_DATA_STUDIO_DB_USER:-mock_data_studio}
      MOCK_DATA_STUDIO_DB_PASSWORD: ${MOCK_DATA_STUDIO_DB_PASSWORD:-mockdatastudiopass}
