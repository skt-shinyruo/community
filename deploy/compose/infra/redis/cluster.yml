x-redis-node: &redis-node
  image: redis:7-alpine
  mem_limit: ${REDIS_MEM_LIMIT:-192m}
  command:
    - redis-server
    - --appendonly
    - 'yes'
    - --cluster-enabled
    - 'yes'
    - --cluster-config-file
    - nodes.conf
    - --cluster-node-timeout
    - '5000'
    - --protected-mode
    - 'no'
    - --bind
    - 0.0.0.0
  healthcheck:
    test:
      - CMD
      - redis-cli
      - ping
    interval: 5s
    timeout: 3s
    retries: 30

services:
  redis-1:
    <<: *redis-node
    volumes:
    - redis_node_1_data:/data
  redis-2:
    <<: *redis-node
    volumes:
    - redis_node_2_data:/data
  redis-3:
    <<: *redis-node
    volumes:
    - redis_node_3_data:/data
  redis-4:
    <<: *redis-node
    volumes:
    - redis_node_4_data:/data
  redis-5:
    <<: *redis-node
    volumes:
    - redis_node_5_data:/data
  redis-6:
    <<: *redis-node
    volumes:
    - redis_node_6_data:/data
  redis-cluster-bootstrap:
    image: redis:7-alpine
    mem_limit: ${REDIS_BOOTSTRAP_MEM_LIMIT:-96m}
    entrypoint:
    - /bin/sh
    - /bootstrap-redis-cluster.sh
    environment:
    - REDIS_CLUSTER_NODES=${SPRING_DATA_REDIS_CLUSTER_NODES:-redis-1:6379,redis-2:6379,redis-3:6379,redis-4:6379,redis-5:6379,redis-6:6379}
    volumes:
    - ../scripts/bootstrap-redis-cluster.sh:/bootstrap-redis-cluster.sh:ro
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      redis-4:
        condition: service_healthy
      redis-5:
        condition: service_healthy
      redis-6:
        condition: service_healthy
    restart: 'no'
