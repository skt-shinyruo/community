services:
  community-app-1:
    extends:
      file: runtime/services/common.yml
      service: community-app-policy
    <<: *community-app-topology
    networks:
      default:
        aliases:
        - community-app

  community-app-2:
    extends:
      file: runtime/services/common.yml
      service: community-app-policy
    <<: *community-app-topology

  community-app-3:
    extends:
      file: runtime/services/common.yml
      service: community-app-policy
    <<: *community-app-topology

  community-oss-1:
    extends:
      file: runtime/services/common.yml
      service: community-oss-policy
    <<: *community-oss-topology
    depends_on:
      community-db-user-bootstrap:
        condition: service_completed_successfully
      mysql-replication-bootstrap:
        condition: service_completed_successfully
      nacos-db-bootstrap:
        condition: service_completed_successfully
      nacos-config-bootstrap:
        condition: service_completed_successfully
      nacos-1:
        condition: service_healthy
      mysql-primary:
        condition: service_healthy
      garage-1:
        condition: service_started
      garage-2:
        condition: service_started
      garage-3:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
        - community-oss

  community-oss-2:
    extends:
      file: runtime/services/common.yml
      service: community-oss-policy
    <<: *community-oss-topology
    depends_on:
      community-oss-1:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully

  community-oss-3:
    extends:
      file: runtime/services/common.yml
      service: community-oss-policy
    <<: *community-oss-topology
    depends_on:
      community-oss-1:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully

  community-gateway-1:
    extends:
      file: runtime/services/common.yml
      service: community-gateway-policy
    <<: *community-gateway-topology
    networks:
      default:
        ipv4_address: ${COMMUNITY_GATEWAY_1_STATIC_IP:?COMMUNITY_GATEWAY_1_STATIC_IP is required}
        aliases:
        - community-gateway

  community-gateway-2:
    extends:
      file: runtime/services/common.yml
      service: community-gateway-policy
    <<: *community-gateway-topology
    networks:
      default:
        ipv4_address: ${COMMUNITY_GATEWAY_2_STATIC_IP:?COMMUNITY_GATEWAY_2_STATIC_IP is required}

  community-gateway-3:
    extends:
      file: runtime/services/common.yml
      service: community-gateway-policy
    <<: *community-gateway-topology
    networks:
      default:
        ipv4_address: ${COMMUNITY_GATEWAY_3_STATIC_IP:?COMMUNITY_GATEWAY_3_STATIC_IP is required}

  community-im-gateway-1:
    extends:
      file: runtime/services/common.yml
      service: community-im-gateway-policy
    <<: *community-im-gateway-topology
    networks:
      default:
        aliases:
        - community-im-gateway

  community-im-gateway-2:
    extends:
      file: runtime/services/common.yml
      service: community-im-gateway-policy
    <<: *community-im-gateway-topology
    networks:
      default:
        aliases:
        - community-im-gateway

  community-im-gateway-3:
    extends:
      file: runtime/services/common.yml
      service: community-im-gateway-policy
    <<: *community-im-gateway-topology
    networks:
      default:
        aliases:
        - community-im-gateway

  im-core-1:
    extends:
      file: runtime/services/common.yml
      service: im-core-policy
    <<: *im-core-topology
    networks:
      default:
        aliases:
        - im-core

  im-core-2:
    extends:
      file: runtime/services/common.yml
      service: im-core-policy
    <<: *im-core-topology

  im-core-3:
    extends:
      file: runtime/services/common.yml
      service: im-core-policy
    <<: *im-core-topology

  im-realtime-1:
    extends:
      file: runtime/services/common.yml
      service: im-realtime-policy
    <<: *im-realtime-topology
    environment:
      <<: *im-realtime-environment
      IM_REALTIME_WORKER_ID: "${IM_REALTIME_WORKER_ID_PREFIX:-im-realtime}-1"
      IM_ROOM_FANOUT_WORKER_INBOX_SLOT: "0"
    networks:
      default:
        aliases:
        - im-realtime

  im-realtime-2:
    extends:
      file: runtime/services/common.yml
      service: im-realtime-policy
    <<: *im-realtime-topology
    environment:
      <<: *im-realtime-environment
      IM_REALTIME_WORKER_ID: "${IM_REALTIME_WORKER_ID_PREFIX:-im-realtime}-2"
      IM_ROOM_FANOUT_WORKER_INBOX_SLOT: "1"

  im-realtime-3:
    extends:
      file: runtime/services/common.yml
      service: im-realtime-policy
    <<: *im-realtime-topology
    environment:
      <<: *im-realtime-environment
      IM_REALTIME_WORKER_ID: "${IM_REALTIME_WORKER_ID_PREFIX:-im-realtime}-3"
      IM_ROOM_FANOUT_WORKER_INBOX_SLOT: "2"
