x-runtime-single-environment: &runtime-single-environment
  NACOS_SERVER_ADDR: "${NACOS_SERVER_ADDR:-nacos:8848}"
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: "${NACOS_SERVER_ADDR:-nacos:8848}"
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: "${NACOS_SERVER_ADDR:-nacos:8848}"

services:
  community-app:
    extends:
      file: runtime/services/common.yml
      service: community-app-policy
    environment:
      <<: *runtime-single-environment
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev},json-logs"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      DB_PRIMARY_HOST: "${DB_PRIMARY_HOST:-mysql}"
      DB_URL: "jdbc:mysql://${DB_PRIMARY_HOST:-mysql}:3306/community?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATA_REDIS_HOST: "${SPRING_DATA_REDIS_HOST:-redis}"
      SPRING_DATA_REDIS_PORT: "${SPRING_DATA_REDIS_PORT:-6379}"
      ELASTICSEARCH_URIS: "${ELASTICSEARCH_URIS:-http://elasticsearch:9200}"
    depends_on:
      mailhog:
        condition: service_started
      nacos-db-bootstrap:
        condition: service_completed_successfully
      nacos-config-bootstrap:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      mock-data-studio-db-bootstrap:
        condition: service_completed_successfully
      community-dev-seed:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      es-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
        - community-app

  community-oss:
    extends:
      file: runtime/services/common.yml
      service: community-oss-policy
    environment:
      <<: *runtime-single-environment
      OSS_DB_URL: "jdbc:mysql://${DB_PRIMARY_HOST:-mysql}:3306/community_oss?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
    depends_on:
      community-db-user-bootstrap:
        condition: service_completed_successfully
      nacos-db-bootstrap:
        condition: service_completed_successfully
      nacos-config-bootstrap:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      garage:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
        - community-oss

  community-gateway:
    extends:
      file: runtime/services/common.yml
      service: community-gateway-policy
    environment:
      <<: *runtime-single-environment
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev},json-logs"
      SPRING_DATA_REDIS_HOST: "${SPRING_DATA_REDIS_HOST:-redis}"
      IM_REALTIME_WS_BASE_URL: "ws://im-realtime:18081${IM_INTERNAL_WORKER_WS_PATH:-/internal/ws/im}"
    depends_on:
      nacos-db-bootstrap:
        condition: service_completed_successfully
      nacos-config-bootstrap:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      community-app:
        condition: service_healthy
      community-oss:
        condition: service_healthy
      community-im-gateway:
        condition: service_healthy
      im-core:
        condition: service_healthy
      im-realtime:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${COMMUNITY_GATEWAY_STATIC_IP:?COMMUNITY_GATEWAY_STATIC_IP is required}
        aliases:
        - community-gateway

  community-im-gateway:
    extends:
      file: runtime/services/common.yml
      service: community-im-gateway-policy
    environment:
      <<: *runtime-single-environment
    depends_on:
      nacos-db-bootstrap:
        condition: service_completed_successfully
      nacos-config-bootstrap:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      im-realtime:
        condition: service_healthy
    networks:
      default:
        aliases:
        - community-im-gateway

  im-core:
    extends:
      file: runtime/services/common.yml
      service: im-core-policy
    environment:
      <<: *runtime-single-environment
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      IM_CORE_DB_PRIMARY_HOST: "${IM_CORE_DB_PRIMARY_HOST:-mysql}"
      IM_CORE_DB_URL: "jdbc:mysql://${IM_CORE_DB_PRIMARY_HOST:-mysql}:3306/im_core?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
    depends_on:
      nacos-db-bootstrap:
        condition: service_completed_successfully
      nacos-config-bootstrap:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      community-db-user-bootstrap:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
        - im-core

  im-realtime:
    extends:
      file: runtime/services/common.yml
      service: im-realtime-policy
    environment:
      <<: *runtime-single-environment
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      SPRING_DATA_REDIS_HOST: "${SPRING_DATA_REDIS_HOST:-redis}"
      SPRING_DATA_REDIS_PORT: "${SPRING_DATA_REDIS_PORT:-6379}"
      IM_REALTIME_WORKER_ID: "${IM_REALTIME_WORKER_ID_PREFIX:-im-realtime}"
      IM_ROOM_FANOUT_WORKER_INBOX_SLOT: "0"
    depends_on:
      nacos-db-bootstrap:
        condition: service_completed_successfully
      nacos-config-bootstrap:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      im-core:
        condition: service_healthy
    networks:
      default:
        aliases:
        - im-realtime
