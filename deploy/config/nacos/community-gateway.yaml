spring:
  cloud:
    gateway:
      server:
        webflux:
          # Regex matching the controlled NGINX/load-balancer peers allowed to assert
          # Forwarded/X-Forwarded-* identity headers (empty = strip them, safe default).
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
          httpserver:
            customizer-enabled: true
          # CORS is only attached to the browser-facing API/file paths; the websocket
          # route (/ws/im) is intentionally not registered and stays without CORS headers.
          globalcors:
            cors-configurations:
              "[/api/**]":
                allowed-origins: ${BROWSER_ALLOWED_ORIGINS}
                allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                allowed-headers: "*"
                exposed-headers: "traceparent"
                allow-credentials: true
                max-age: 3600
              "[/files/**]":
                allowed-origins: ${BROWSER_ALLOWED_ORIGINS}
                allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                allowed-headers: "*"
                exposed-headers: "traceparent"
                allow-credentials: true
                max-age: 3600
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods Access-Control-Expose-Headers Access-Control-Max-Age, RETAIN_FIRST
          routes:
            - id: drive-share-verify-rate-limit
              order: -30
              uri: lb://community-app
              predicates:
                - Path=/api/drive/shares/*/verify
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@gatewayRateLimitKeyResolver}"
            - id: im-session-edge
              order: -100
              uri: lb://community-im-gateway
              predicates:
                - Method=POST
                - Path=/api/im/sessions
            - id: im-ws-edge
              order: -100
              uri: lb:ws://community-im-gateway
              predicates:
                - Path=/ws/im
                - Header=Upgrade, (?i)websocket
            - id: oss-api
              order: -20
              uri: lb://community-oss
              predicates:
                - Path=/api/oss,/api/oss/**
            - id: im-core
              order: -10
              uri: lb://im-core
              predicates:
                - Path=/api/im,/api/im/**
            - id: bootstrap-api
              uri: lb://community-app
              predicates:
                - Path=/api,/api/**
            - id: oss-files
              uri: lb://community-oss
              predicates:
                - Path=/files,/files/**

security:
  jwt:
    issuer: community-auth
    access-token-audience: community-api
