spring:
  cloud:
    gateway:
      server:
        webflux:
          forwarded:
            enabled: false
          x-forwarded:
            enabled: false
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods Access-Control-Expose-Headers Access-Control-Max-Age, RETAIN_FIRST
          routes:
            - id: im-session-edge
              order: -100
              uri: lb://community-im-gateway
              predicates:
                - Method=POST
                - Path=/api/im/sessions
            - id: im-ws-edge
              order: -100
              uri: lb:ws://community-im-gateway
              predicates:
                - Path=/ws/im
                - Header=Upgrade, (?i)websocket
            - id: oss-api
              order: -20
              uri: lb://community-oss
              predicates:
                - Path=/api/oss,/api/oss/**
            - id: im-core
              order: -10
              uri: lb://im-core
              predicates:
                - Path=/api/im,/api/im/**
            - id: bootstrap-api
              uri: lb://community-app
              predicates:
                - Path=/api,/api/**
            - id: oss-files
              uri: lb://community-oss
              predicates:
                - Path=/files,/files/**

security:
  jwt:
    issuer: community-auth
    access-token-audience: community-api

gateway:
  # Enable only with the controlled NGINX/load-balancer CIDRs supplied at runtime.
  trusted-proxy:
    enabled: ${GATEWAY_TRUSTED_PROXY_ENABLED:false}
    cidrs: ${GATEWAY_TRUSTED_PROXY_CIDRS:}
    source: compose-environment
  cors:
    allowed-origins: ${BROWSER_ALLOWED_ORIGINS}
  http:
    rate-limit:
      enabled: true
      fail-open-on-error: false
      policies:
        "[/api/drive/shares/{shareToken}/verify]":
          enabled: true
          limit: 10
          window: 1m
