im:
  access-token-freshness:
    community-service-id: ${IM_ACCESS_TOKEN_FRESHNESS_COMMUNITY_SERVICE_ID:community-app}
    request-timeout: ${IM_ACCESS_TOKEN_FRESHNESS_REQUEST_TIMEOUT:500ms}
  gateway:
    cors:
      allowed-origins: ${BROWSER_ALLOWED_ORIGINS}
    public-ws-url: ${IM_GATEWAY_PUBLIC_WS_URL}
    session:
      ticket-ttl: PT2M
    worker:
      service-id: im-realtime-worker
      worker-id-metadata-key: workerId
    ws:
      path: /ws/im
      first-frame-timeout-ms: 5000
      max-inbound-chars: 10000
      max-inbound-buffer-frames: 64
