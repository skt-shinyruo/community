community:
  web:
    # Enable only with the controlled Community Gateway CIDRs supplied at runtime.
    trusted-proxy:
      enabled: ${COMMUNITY_APP_TRUSTED_PROXY_ENABLED:false}
      cidrs: ${COMMUNITY_APP_TRUSTED_PROXY_CIDRS:}
      source: compose-environment

gateway:
  origin-guard:
    enabled: true
    allowed-origins: ${BROWSER_ALLOWED_ORIGINS}
    fail-open-when-allowlist-empty: false

spring:
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB
  mail:
    host: mailhog
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  health:
    elasticsearch:
      enabled: true

security:
  jwt:
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth
    refresh-cookie-same-site: Lax
    refresh-cookie-secure: false

drive:
  share:
    ticket-secret: ${DRIVE_SHARE_TICKET_SECRET:}

auth:
  refresh:
    store: db
    cleanup:
      enabled: true
      interval-ms: 3600000
  captcha:
    store: redis
    ttl-seconds: 60
    max-failures: 3
  registration:
    code:
      store: redis
      ttl-seconds: 600
      max-failures: 3
      resend-cooldown-seconds: 60
      expose-code: false
    draft:
      store: redis
      ttl-seconds: 1800
    mail:
      enabled: true
      from: no-reply@community.local
      subject: 注册验证码
  password-reset:
    reset-base-url: ${FRONTEND_PUBLIC_ORIGIN}
    store: redis
    ttl-seconds: 600
    request-window-seconds: 3600
    max-requests-per-email: 3
    max-requests-per-ip: 20
  login-rate-limit:
    enabled: true
    window-seconds: 60
    max-failures-per-ip: 20
    max-failures-per-user: 5
    captcha-required-failures-per-ip: 5
    captcha-required-failures-per-user: 2

http:
  idempotency:
    enabled: true
    store: DB

xxl:
  job:
    enabled: true
    admin:
      addresses: http://xxl-job-admin:8080/xxl-job-admin
    executor:
      appname: community-app
      address: ""

market:
  order:
    auto-confirm-batch-size: ${MARKET_ORDER_AUTO_CONFIRM_BATCH_SIZE:100}

wallet:
  test-credits:
    enabled: ${WALLET_TEST_CREDITS_ENABLED:false}
    grant-enabled: ${WALLET_TEST_CREDIT_GRANT_ENABLED:false}
    discard-enabled: ${WALLET_TEST_CREDIT_DISCARD_ENABLED:false}
    max-grant-per-request: ${WALLET_TEST_CREDIT_MAX_GRANT_PER_REQUEST:1000}
    max-discard-per-request: ${WALLET_TEST_CREDIT_MAX_DISCARD_PER_REQUEST:1000}
    grant-quota-per-user: ${WALLET_TEST_CREDIT_GRANT_QUOTA_PER_USER:5000}
    discard-quota-per-user: ${WALLET_TEST_CREDIT_DISCARD_QUOTA_PER_USER:5000}

content:
  storage: redis
  score:
    refresh:
      enabled: true
      batch-size: 200

events:
  outbox:
    enabled: true
    batch-size: 50
    processing-lease: 30s
    max-retries: 50
    base-backoff: 5s
    max-backoff: 10m
    worker-fixed-delay-ms: 1000

social:
  storage: db
  events:
    relation-instance-publishing-enabled: false

growth:
  business-zone-id: Asia/Shanghai

oss:
  client:
    base-url: ${OSS_CLIENT_BASE_URL:http://community-oss:18090}
    service-subject: ${OSS_CLIENT_SERVICE_SUBJECT:community-app}
    audience: ${OSS_CLIENT_AUDIENCE:community-oss}
    scope: ${OSS_CLIENT_SCOPE:oss.internal}
    token-ttl: ${OSS_CLIENT_TOKEN_TTL:PT5M}

search:
  storage: es
  reindex:
    page-size: ${SEARCH_REINDEX_PAGE_SIZE:500}
    lock-ttl: ${SEARCH_REINDEX_LOCK_TTL:PT30M}
  idempotency:
    cleanup-enabled: true
    retention-days: 7
    cleanup-interval-ms: 21600000
  index:
    prefix: community_posts_v
    initialize: true
    keep-history: ${SEARCH_INDEX_KEEP_HISTORY:2}

analytics:
  max-days-range: 31
  ingest:
    enabled: false
    record-uv: true
    record-dau: true
    include-paths:
      - /api/posts/**
      - /api/search/**
      - /api/notices/**
    exclude-paths:
      - /api/analytics/**
      - /api/auth/**
      - /api/ops/**
      - /actuator/**
      - /internal/**
      - /files/**
