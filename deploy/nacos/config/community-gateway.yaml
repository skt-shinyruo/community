spring:
  cloud:
    gateway:
      server:
        webflux:
          forwarded:
            enabled: false
          x-forwarded:
            enabled: false

security:
  jwt:
    issuer: community-auth
    access-token-audience: community-api

gateway:
  # Enable only with the controlled NGINX/load-balancer CIDRs supplied at runtime.
  trusted-proxy:
    enabled: ${GATEWAY_TRUSTED_PROXY_ENABLED:false}
    cidrs: ${GATEWAY_TRUSTED_PROXY_CIDRS:}
    source: compose-environment
  cors:
    allowed-origins: ${BROWSER_ALLOWED_ORIGINS}
  im-edge:
    service-id: community-im-gateway
    session-path: /api/im/sessions
    ws-path: /ws/im
  http:
    routes:
      - id: oss-api
        path-prefix: /api/oss
        service-id: community-oss
      - id: im-core
        path-prefix: /api/im
        service-id: im-core
      - id: bootstrap-api
        path-prefix: /api
        service-id: community-app
      - id: oss-files
        path-prefix: /files
        service-id: community-oss
    rate-limit:
      enabled: true
      fail-open-on-error: false
      policies:
        "[/api/drive/shares/{shareToken}/verify]":
          enabled: true
          limit: 10
          window: 1m
    traffic-policy:
      default-policy-id: baseline
      default-tags:
        plane: http
      rules: []
